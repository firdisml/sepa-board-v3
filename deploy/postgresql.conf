# Tuned for the measured box: Contabo Cloud VPS 4 — 4 cores, 7.8 GB RAM,
# 96 GB SSD, Ubuntu 24.04. Workload is one nightly bulk ingest (~47k rows)
# plus a low-traffic dashboard, on ~410 MB of data.

listen_addresses = '*'
port = 5432
max_connections = 100          # PgBouncer fronts this; clients never come direct

# ---- memory ----
shared_buffers = 2GB           # ~25% RAM, the standard starting point
effective_cache_size = 5GB     # planner hint: RAM the OS can cache with
work_mem = 32MB                # per sort/hash node; the RS/decile queries sort
maintenance_work_mem = 512MB    # VACUUM/CREATE INDEX and the restore

# ---- write behaviour ----
wal_level = replica
max_wal_size = 4GB             # the 47k-row nightly upsert should not force
min_wal_size = 512MB           # a checkpoint mid-batch
checkpoint_completion_target = 0.9
wal_compression = on

# ---- SSD assumptions ----
random_page_cost = 1.1         # default 4.0 assumes spinning rust
effective_io_concurrency = 200

# ---- parallelism (4 cores) ----
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2

# ---- TLS: deliberately OFF here ----
# This server is `expose`-only in compose — never published to the host — so
# the sole client is PgBouncer over the internal Docker bridge. TLS terminates
# at PgBouncer, which owns the one internet-facing port. Enabling it here also
# fails outright: Postgres requires the key be owned by the DB user or root,
# while PgBouncer needs it readable as its own uid, and one file cannot be both.
ssl = off

# ---- observability ----
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
log_min_duration_statement = 2000   # a query over 2s is worth seeing
log_checkpoints = on
log_connections = off               # Vercel churns connections; would flood
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'
timezone = 'UTC'                    # every date in this project is UTC
datestyle = 'iso, mdy'
