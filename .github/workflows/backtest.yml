name: backtest

on:
  # Chained on the scan so the board and its evidence stay in step, but kept a
  # separate workflow: a backtest failure must never redden the scan that
  # produced tomorrow's board.
  workflow_run:
    # BOTH scans, not just scan-my. Chained only to Bursa, this ran at 12:38
    # UTC — before the 22:00 US scan existed — so US candidates never got
    # covered at all. analyst.py/backtest.py are already market-aware; they
    # simply were never invoked after a US board landed.
    workflows: [scan-my, scan-us]
    types: [completed]
  workflow_dispatch:
    inputs:
      universe:
        description: "Whole exchange instead of the board"
        type: choice
        options: ["MY", "US", ""]
        default: "MY"
      strategy:
        description: "Entry strategy"
        type: choice
        options: [breakout, ma20_bounce, ma50_bounce, episodic_pivot, pocket_pivot,
                  buyable_gap_up, ma200_reclaim, undercut_rally,
                  donchian, darvas]
        default: breakout
      years:
        description: "Years of history"
        default: "2"
      deep_history:
        description: "Survivorship fix: fetches the WHOLE live+delisted directory (~1,100 EODHD calls for KLSE, ~7-10min), no liquidity pre-filter — needed for years > ~1"
        type: boolean
        default: false
      label:
        description: "Label for this run"
        default: ""

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Warehouse-backed runs finish in minutes. --deep-history is the long pole
    # and scales with the EXCHANGE, not the strategy: KLSE is ~1,200 symbols
    # (~10 min), but US is 23,217 once delisted names are included — 6,558 live
    # plus 16,659 delisted — which takes ~28 minutes of fetching alone. At the
    # old 30-minute ceiling the US run spent 29.6 min fetching and was killed
    # before the backtest could run, reported only as "failure".
    # Subsequent same-week runs hit the parquet cache and finish quickly; this
    # budget is for the first cold fetch of a large exchange.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - name: Install dependencies
        run: pip install -r scanner/requirements.txt
      # deep-history parquet cache: without this every deep run re-pays ~1,100
      # EODHD calls. Keyed per ISO week — histories go stale gradually, and a
      # weekly re-pull keeps recent bars honest while the 5y depth stays cached.
      # restore-keys lets a new week warm-start from last week's cache.
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # SPLIT restore/save, and save with if:always(). actions/cache only
      # writes its cache when the job SUCCEEDS, which turned a single failure
      # into a self-perpetuating one: the run died, its 12,107 fetched
      # histories were discarded, the next run re-fetched all 23,262 symbols
      # from cold, EODHD throttled the repeated hammering until the fetch took
      # 109 minutes instead of 28, and the job then died on the timeout instead
      # — never once reaching the step that would have saved the cache. Every
      # run logged "0 cached". Saving unconditionally means expensive fetch
      # work survives a failure and the next attempt starts warm.
      - name: Restore deep-history cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/deep_history
          key: deep-history-${{ inputs.years || '2' }}y-${{ steps.week.outputs.week }}
          restore-keys: deep-history-${{ inputs.years || '2' }}y-
      - name: Run backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Python block-buffers stdout when it is not a TTY. A US deep-history
          # run died after the fetch with NO output at all — the fetch's own
          # frequent logging had been flushing the buffer, so once it stopped,
          # every later line INCLUDING THE TRACEBACK sat unflushed and was lost
          # when the process ended. That read as a mysterious silent kill and
          # sent three separate investigations after memory that was never the
          # problem (measured: the compute is 13s and ~1GB at that exact shape).
          PYTHONUNBUFFERED: "1"
          # only consumed when --deep-history calls eod.symbols()/eod.history();
          # a plain warehouse-backed run never touches the network
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          # inputs are passed as env, never interpolated into the shell (§11.1)
          # On a chained run there are no inputs, so derive the market from
          # WHICH scan triggered us — otherwise a US scan would kick off yet
          # another MY backtest and US would never be measured nightly.
          BT_UNIVERSE: ${{ inputs.universe || (github.event.workflow_run.name == 'scan-us' && 'US') || 'MY' }}
          BT_STRATEGY: ${{ inputs.strategy || 'breakout' }}
          BT_YEARS: ${{ inputs.years || '2' }}
          BT_DEEP_HISTORY: ${{ inputs.deep_history && 'true' || 'false' }}
          BT_LABEL: ${{ inputs.label }}
        run: |
          LABEL="${BT_LABEL:-nightly $(date -u +%F)}"
          DEEP_FLAG=""
          if [ "$BT_DEEP_HISTORY" = "true" ]; then DEEP_FLAG="--deep-history"; fi
          python -m scanner.backtest \
            --universe "$BT_UNIVERSE" \
            --markets "$BT_UNIVERSE" \
            --strategy "$BT_STRATEGY" \
            --years "$BT_YEARS" \
            $DEEP_FLAG \
            --label "$LABEL"

      - name: Save deep-history cache
        # always(): the whole point is that a failed run keeps its fetch work.
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/deep_history
          key: deep-history-${{ inputs.years || '2' }}y-${{ steps.week.outputs.week }}
