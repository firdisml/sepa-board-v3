name: backtest

on:
  # Chained on the scan so the board and its evidence stay in step, but kept a
  # separate workflow: a backtest failure must never redden the scan that
  # produced tomorrow's board.
  workflow_run:
    workflows: [scan-my]
    types: [completed]
  workflow_dispatch:
    inputs:
      universe:
        description: "Whole exchange (MY) instead of the board"
        type: choice
        options: ["MY", ""]
        default: "MY"
      strategy:
        description: "Entry strategy"
        type: choice
        options: [breakout, ma20_bounce, ma50_bounce, episodic_pivot, pocket_pivot, buyable_gap_up]
        default: breakout
      years:
        description: "Years of history"
        default: "2"
      deep_history:
        description: "Survivorship fix: fetches the WHOLE live+delisted directory (~1,100 EODHD calls for KLSE, ~7-10min), no liquidity pre-filter — needed for years > ~1"
        type: boolean
        default: false
      label:
        description: "Label for this run"
        default: ""

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # warehouse-backed runs: 972 tickers x 2y vectorised in ~3s, wall time is
    # warehouse I/O. --deep-history fetches the whole live+delisted directory
    # one ticker at a time (~1,100 calls for KLSE) — budget ~10min for that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - name: Install dependencies
        run: pip install -r scanner/requirements.txt
      # deep-history parquet cache: without this every deep run re-pays ~1,100
      # EODHD calls. Keyed per ISO week — histories go stale gradually, and a
      # weekly re-pull keeps recent bars honest while the 5y depth stays cached.
      # restore-keys lets a new week warm-start from last week's cache.
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore deep-history cache
        uses: actions/cache@v4
        with:
          path: .cache/deep_history
          key: deep-history-${{ inputs.years || '2' }}y-${{ steps.week.outputs.week }}
      - name: Run backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # only consumed when --deep-history calls eod.symbols()/eod.history();
          # a plain warehouse-backed run never touches the network
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          # inputs are passed as env, never interpolated into the shell (§11.1)
          BT_UNIVERSE: ${{ inputs.universe || 'MY' }}
          BT_STRATEGY: ${{ inputs.strategy || 'breakout' }}
          BT_YEARS: ${{ inputs.years || '2' }}
          BT_DEEP_HISTORY: ${{ inputs.deep_history && 'true' || 'false' }}
          BT_LABEL: ${{ inputs.label }}
        run: |
          LABEL="${BT_LABEL:-nightly $(date -u +%F)}"
          DEEP_FLAG=""
          if [ "$BT_DEEP_HISTORY" = "true" ]; then DEEP_FLAG="--deep-history"; fi
          python -m scanner.backtest \
            --universe "$BT_UNIVERSE" \
            --markets "$BT_UNIVERSE" \
            --strategy "$BT_STRATEGY" \
            --years "$BT_YEARS" \
            $DEEP_FLAG \
            --label "$LABEL"
